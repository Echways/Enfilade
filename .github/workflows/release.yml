name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match tag with version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          MAIN: origin/${{ github.event.repository.default_branch }}
        run: |
          version="${TAG#v}"
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $TAG does not match <Version>$declared</Version> in Directory.Build.props"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN"; then
            echo "::error::tag $TAG points at a commit that is not on ${MAIN#origin/}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  nuget:
    name: Publish to NuGet.org
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Enfilade/${{ needs.version.outputs.version }}
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  release:
    name: Publish release
    needs: [version, nuget]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" artifacts/packages/* --repo "$GITHUB_REPOSITORY" --title "Enfilade $VERSION" \
            --generate-notes --verify-tag "${flags[@]}"
