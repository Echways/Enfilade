name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Check C# formatting
        run: dotnet format Enfilade.slnx --verify-no-changes

  test:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Test
        run: dotnet test --project tests/Enfilade.Tests -c Release --results-directory "$GITHUB_WORKSPACE/TestResults" --report-xunit-junit --coverage --coverage-output-format cobertura

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: TestResults/*.junit.xml
          check_name: Tests
          annotate_only: true
          require_tests: true
          include_time_in_summary: true

      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/**/*.cobertura.xml" -targetdir:coverage -reporttypes:MarkdownSummaryGithub
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  pack:
    name: Pack
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Pack
        run: dotnet pack Enfilade.slnx -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}
          if-no-files-found: error
